# swaylock 锁屏配置(swaylock-effects 分支)
# 由 niri/home.nix 软链到 ~/.config/swaylock/config
# 格式:option=value(去掉命令行的 --);手动测试:swaylock -f

# 背景:截取当前屏幕 + 高斯模糊 + 暗角
screenshots
effect-blur=20x5
effect-vignette=0.5:0.5

# 时钟
clock
timestr=%H:%M
datestr=%Y年%m月%d日 %A
font=Noto Sans CJK SC
font-size=120

# 密码指示器
indicator
indicator-radius=300
indicator-thickness=8
indicator-caps-lock
show-failed-attempts

# 配色(Tokyo Night)
key-hl-color=7aa2f7
bs-hl-color=f7768e

ring-color=1a1b26
ring-ver-color=7aa2f7
ring-wrong-color=f7768e
ring-clear-color=e0af68

inside-color=1a1b26cc
inside-ver-color=1a1b26cc
inside-wrong-color=1a1b26cc
inside-clear-color=1a1b26cc

line-color=1a1b26
line-ver-color=7aa2f7
line-wrong-color=f7768e
line-clear-color=e0af68

separator-color=00000000

text-color=c0caf5
text-ver-color=c0caf5
text-wrong-color=f7768e
text-clear-color=c0caf5

# 手感
fade-in=0.0
