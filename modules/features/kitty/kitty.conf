# =============================================================
# kitty 终端配置
# 由 home-manager 读入，生成到 ~/.config/kitty/kitty.conf
# rebuild 后模块会自动 pkill -USR1 kitty 热重载
# 生效验证：kitty + ctrl+shift+f2 查看实际生效值
# =============================================================

# ---------- 字体 ----------
# Recursive Mono Nerd Font（已在 fonts/nixos.nix 安装）
# 中文会自动 fontconfig 回退到 Noto Sans CJK
font_family      RecMonoCasual Nerd Font
bold_font        RecMonoCasual Nerd Font Bold
italic_font      RecMonoCasual Nerd Font Italic
bold_italic_font RecMonoCasual Nerd Font Bold Italic
font_size        14.0

# 修补 Powerline 符号，让状态栏 glyph 连续无缝隙
disable_ligatures never
symbol_map U+E0B0-U+E0B3,U+E0C0-U+E0C7 PowerlineSymbols

# ---------- 光标 ----------
cursor                  #7fc8ff
cursor_shape     beam
cursor_beam_thickness   1.5
cursor_blink_interval   0
shell                   $SHELL

# ---------- 滚动 ----------
scrollback_lines 10000
scrollback_pager_history_size 100
wheel_scroll_multiplier 5.0
mouse_hide_wait  3.0

# ---------- 窗口 ----------
remember_window_size    no
initial_window_width    1000
initial_window_height   600
# 由合成器绘制标题栏（Hyprland 下有边框和圆角，更协调）
hide_window_decorations yes
confirm_os_window_close 0
window_alert_on_bell    no
single_close_tab_action close

# ---------- 性能 ----------
sync_to_monitor      yes
enable_audio_bell    no
repaint_delay        10
input_delay          2

# ---------- 标签栏 ----------
tab_bar_style        powerline
tab_powerline_style  slanted
tab_bar_min_tabs     1
tab_title_template   "{fmt.fg.blue}{index}{fmt.fg.tab}{bell}{activity_symbol}{fmt.fg.foreground}: {title}"
active_tab_title_template "{fmt.fg.green}{index}{fmt.fg.tab}{bell}{activity_symbol}{fmt.fg.foreground}: {title}"

# ---------- 配色（Tokyo Night 风格）----------
foreground              #c0caf5
background              #1a1b26

# 常规色
color0                  #15161e
color1                  #f7768e
color2                  #9ece6a
color3                  #e0af68
color4                  #7aa2f7
color5                  #bb9af7
color6                  #7dcfff
color7                  #a9b1d6

# 亮色
color8                  #414868
color9                  #f7768e
color10                 #9ece6a
color11                 #e0af68
color12                 #7aa2f7
color13                 #bb9af7
color14                 #7dcfff
color15                 #c0caf5

# 扩展
mark1_foreground        #1a1b26
mark1_background        #7aa2f7
selection_foreground    #1a1b26
selection_background    #33467c

# ---------- 键位 ----------
# 注意：这些是 kitty 内部键位，与 Hyprland 的 SUPER 键位不冲突
map ctrl+shift+enter    new_window
map ctrl+shift+t        new_tab
map ctrl+shift+w        close_tab
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+equal    change_font_size all +1.0
map ctrl+shift+minus    change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard
map ctrl+shift+f        load_config_file
map f1                  copy_to_buffer a
map f2                  paste_from_buffer a
